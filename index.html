<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAWLIID SHEIKH | CYBER COMMAND & eFOOTBALL PRO</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --ef-yellow: #ffd700;
            --ef-blue: #0055ff;
            --dark-bg: #010402;
            --panel-bg: rgba(4, 14, 8, 0.95);
            --glow-green: 0 0 20px rgba(0, 255, 65, 0.7);
            --glow-cyan: 0 0 20px rgba(0, 243, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        #matrix-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            opacity: 0.3;
        }

        /* HEADER */
        header {
            width: 96%;
            max-width: 1420px;
            margin: 18px auto 0;
            padding: 16px 26px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-green);
            box-shadow: var(--glow-green);
            border-radius: 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-wrapper {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px dashed var(--neon-cyan);
            border-top-color: var(--neon-green);
            border-bottom-color: var(--neon-pink);
            animation: spin 5s linear infinite;
            box-shadow: var(--glow-cyan);
        }

        .logo-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            object-position: top;
            border: 2px solid var(--neon-green);
            z-index: 2;
        }

        .title-box h1 {
            font-size: clamp(1.3rem, 3vw, 2.2rem);
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--neon-green);
        }

        .title-box p {
            color: var(--neon-cyan);
            font-size: 0.88rem;
            margin-top: 4px;
        }

        .live-badge {
            background: rgba(0, 255, 65, 0.15);
            border: 1px solid var(--neon-green);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 10px; height: 10px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        /* DASHBOARD GRID */
        .dashboard {
            width: 96%;
            max-width: 1420px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        @media (min-width: 1024px) {
            .dashboard {
                grid-template-columns: 280px 1fr 320px;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1.5px solid var(--neon-green);
            border-radius: 14px;
            padding: 18px;
            box-shadow: var(--glow-green);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            color: var(--neon-cyan);
            font-size: 1.05rem;
            border-bottom: 1px solid rgba(0, 243, 255, 0.4);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (min-width: 1024px) {
            .tool-list { grid-template-columns: 1fr; }
        }

        .cyber-btn {
            background: rgba(0, 255, 65, 0.05);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: left;
            transition: all 0.2s;
        }

        .cyber-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 12px var(--neon-green);
            transform: translateX(4px);
        }

        /* TERMINAL WINDOW */
        .terminal-window {
            height: 520px;
            padding: 0;
            overflow: hidden;
        }

        .terminal-bar {
            background: #0b1c12;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-green);
        }

        .dots { display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }

        .terminal-body {
            padding: 18px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .input-bar {
            display: flex;
            padding: 12px 18px;
            background: #060f09;
            border-top: 1px solid rgba(0, 255, 65, 0.3);
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: var(--neon-green);
            flex-grow: 1;
            font-size: 1rem;
            outline: none;
            margin-left: 8px;
        }

        /* RADAR */
        .radar-container {
            width: 180px; height: 180px;
            margin: 10px auto 20px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            position: relative;
            background: radial-gradient(circle, rgba(0,255,65,0.15) 0%, rgba(0,0,0,0.85) 70%);
            overflow: hidden;
            box-shadow: var(--glow-green);
        }

        .radar-sweep {
            position: absolute;
            top: 50%; left: 50%;
            width: 50%; height: 50%;
            background: linear-gradient(45deg, rgba(0, 255, 65, 0.7), transparent);
            transform-origin: 0 0;
            animation: spin 3s linear infinite;
