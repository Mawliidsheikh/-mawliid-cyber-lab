<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAWLIID SHEIKH | CYBER LAB & eFOOTBALL</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --ef-yellow: #ffd700;
            --ef-blue: #0066ff;
            --dark-bg: #030504;
            --panel-bg: rgba(8, 18, 12, 0.9);
            --glow-green: 0 0 15px rgba(0, 255, 65, 0.5);
            --glow-cyan: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        #matrix-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            opacity: 0.25;
        }

        /* MAIN WEBSITE HEADER */
        header {
            width: 96%;
            max-width: 1400px;
            margin: 15px auto 0;
            padding: 15px 25px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-green);
            box-shadow: var(--glow-green);
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-wrapper {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px dashed var(--neon-cyan);
            border-top-color: var(--neon-green);
            border-bottom-color: var(--neon-pink);
            animation: spin 6s linear infinite;
            box-shadow: var(--glow-cyan);
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            object-position: top;
            border: 2px solid var(--neon-green);
            z-index: 2;
        }

        .title-box h1 {
            font-size: clamp(1.3rem, 3vw, 2rem);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .title-box p {
            color: var(--neon-cyan);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .status-pill {
            background: rgba(0, 255, 65, 0.12);
            border: 1px solid var(--neon-green);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 10px; height: 10px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        /* Dashboard Grid */
        .dashboard {
            width: 96%;
            max-width: 1400px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        @media (min-width: 992px) {
            .dashboard {
                grid-template-columns: 270px 1fr 310px;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--neon-green);
            border-radius: 10px;
            padding: 18px;
            box-shadow: var(--glow-green);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            color: var(--neon-cyan);
            font-size: 1.05rem;
            border-bottom: 1px solid rgba(0, 243, 255, 0.4);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .tool-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (min-width: 992px) {
            .tool-list { grid-template-columns: 1fr; }
        }

        .cyber-btn {
            background: rgba(0, 255, 65, 0.05);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: left;
            transition: all 0.2s;
        }

        .cyber-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 12px var(--neon-green);
        }

        /* Terminal */
        .terminal-window {
            height: 490px;
            padding: 0;
            overflow: hidden;
        }

        .terminal-bar {
            background: #0b1c12;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--neon-green);
        }

        .dots { display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }

        .terminal-body {
            padding: 16px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.94rem;
            line-height: 1.6;
        }

        .input-bar {
            display: flex;
            padding: 12px 16px;
            background: #060f09;
            border-top: 1px solid rgba(0, 255, 65, 0.3);
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: var(--neon-green);
            flex-grow: 1;
            font-size: 1rem;
            outline: none;
            margin-left: 8px;
        }

        /* Radar */
        .radar-container {
            width: 170px; height: 170px;
            margin: 10px auto 20px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            position: relative;
            background: radial-gradient(circle, rgba(0,255,65,0.15) 0%, rgba(0,0,0,0.8) 70%);
            overflow: hidden;
        }

        .radar-sweep {
            position: absolute;
            top: 50%; left: 50%;
            width: 50%; height: 50%;
            background: linear-gradient(45deg, rgba(0, 255, 65, 0.7), transparent);
            transform-origin: 0 0;
            animation: spin 3s linear infinite;
        }

        .log-feed {
            margin-top: auto;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            border-left: 3px solid var(--neon-pink);
            height: 120px;
            overflow: hidden;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: rgba(0, 255, 65, 0.7);
            margin-top: auto;
            margin-bottom: 60px;
        }

        /* ================= KONAMI eFOOTBALL FLOATING BUTTON ================= */
        .floating-efootball-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #0055ff, #ff0055);
            color: #fff;
            border: 3px solid var(--ef-yellow);
            padding: 16px 28px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 0 35px rgba(0, 85, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: bounceFloat 2s infinite;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: auto;
        }

        .floating-efootball-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ff0055, #ffd700);
            color: #000;
        }

        /* ================= POPUP eFOOTBALL MODAL (KONAMI STYLE) ================= */
        .game-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(2, 6, 12, 0.97);
            z-index: 99999999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: 'Segoe UI', sans-serif;
        }

        .game-modal.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 1050px;
            background: #040d1a;
            border: 2px solid var(--ef-yellow);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 102, 255, 0.9);
            display: flex;
            flex-direction: column;
        }

        .modal-top {
            background: linear-gradient(90deg, #002266, #071326, #660022);
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--ef-yellow);
        }

        .room-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .room-input {
            background: #000;
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            width: 120px;
            text-align: center;
        }

        .room-btn {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .close-modal-btn {
            background: var(--neon-pink);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .arena-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 12px;
        }

        @media (min-width: 900px) {
            .arena-layout {
                grid-template-columns: 2.3fr 1fr;
            }
        }

        .pitch-container {
            position: relative;
            background: #083d18;
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        #konamiPitch {
            width: 100%;
            height: auto;
            display: block;
            max-width: 720px;
        }

        .online-sidebar {
            background: #071528;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 260px;
        }

        .online-players-list {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 8px;
        }

        .chat-messages {
            flex-grow: 1;
            background: rgba(0,0,0,0.6);
            border-radius: 6px;
            padding: 8px;
            overflow-y: auto;
            max-height: 120px;
            font-size: 0.82rem;
            margin-bottom: 8px;
            color: #e0f7fa;
        }
