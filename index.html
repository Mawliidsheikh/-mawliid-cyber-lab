<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawliid Portal - Student Dashboard</title>
    <style>
        :root {
            --sidebar-bg: #272b30;
            --sidebar-text: #c2c7d0;
            --sidebar-active: #3b4048;
            --topbar-bg: #ffffff;
            --body-bg: #eef2f6;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #2563eb;
        }

        body.dark-mode {
            --topbar-bg: #181b20;
            --body-bg: #111317;
            --card-bg: #1b1f26;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #2d333d;
        }

        body.sidebar-blue {
            --sidebar-bg: #0f294a;
            --sidebar-active: #1d4ed8;
        }

        body.sidebar-teal {
            --sidebar-bg: #113a3d;
            --sidebar-active: #0f766e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--body-bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            transition: background 0.25s, color 0.25s;
        }

        /* Sidebar */
        .sidebar {
            width: 225px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.25s, background 0.25s;
            z-index: 100;
            padding-bottom: 20px;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .school-logo-box {
            padding: 14px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .school-badge {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #ffffff;
            color: #0f294a;
            border: 3px solid #eab308;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.72rem;
            text-align: center;
            line-height: 1.1;
        }

        .profile-box {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 11px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #60a5fa;
            background: #334155;
        }

        .profile-name {
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .nav-list {
            list-style: none;
            padding: 8px 0;
        }

        .nav-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--sidebar-text);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.86rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, color 0.15s;
        }

        .nav-btn-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--sidebar-active);
            color: #ffffff;
        }

        .sub-menu {
            display: none;
            background: rgba(0, 0, 0, 0.22);
            list-style: none;
        }

        .sub-menu.open {
            display: block;
        }

        .sub-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: #cbd5e1;
            padding: 8px 16px 8px 42px;
            text-align: left;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .sub-btn:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.06);
        }

        /* Main Area */
        .main-wrapper {
            margin-left: 225px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: margin-left 0.25s;
        }

        .main-wrapper.expanded {
            margin-left: 0;
        }

        /* Topbar */
        .topbar {
            background: var(--topbar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .icon-btn {
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .icon-btn:hover {
            filter: brightness(0.96);
        }

        .school-title {
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.4px;
            color: var(--text-main);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color
