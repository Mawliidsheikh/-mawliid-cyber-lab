<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAWLIID SHEIKH | SOC COMMAND & THREAT INTELLIGENCE</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-orange: #ff9900;
            --dark-bg: #010408;
            --panel-bg: rgba(3, 14, 28, 0.94);
            --glow-cyan: 0 0 20px rgba(0, 243, 255, 0.5);
            --glow-green: 0 0 20px rgba(0, 255, 65, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-cyan);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        #matrix-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            opacity: 0.25;
        }

        /* TOP HEADER SOC */
        header {
            width: 98%;
            max-width: 1650px;
            margin: 12px auto 0;
            padding: 12px 25px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: var(--glow-cyan);
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px dashed var(--neon-pink);
            border-top-color: var(--neon-cyan);
            animation: spin 4s linear infinite;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            z-index: 2;
        }

        .title-box h1 {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .title-box p {
            color: var(--neon-green);
            font-size: 0.78rem;
            margin-top: 2px;
        }

        .soc-status-badges {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .soc-badge {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        /* LIVE TICKER */
        .ticker-wrap {
            width: 98%;
            max-width: 1650px;
            margin: 8px auto;
            background: #000;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px;
            font-size: 0.82rem;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: var(--glow-green);
            border-radius: 4px;
        }
        .ticker-move {
            display: inline-block;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* MAIN SOC GRID */
        .soc-container {
            width: 98%;
            max-width: 1650px;
            margin: 10px auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            flex-grow: 1;
        }

        @media (min-width: 1200px) {
            .soc-container {
                grid-template-columns: 300px 1fr 320px;
            }
        }

        .soc-panel {
            background: var(--panel-bg);
            border: 1.5px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 15px;
            box-shadow: var(--glow-cyan);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-header {
            color: var(--neon-green);
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .soc-btn {
            background: rgba(0, 243, 255, 0.05);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-align: left;
            font-size: 0.82rem;
            transition: all 0.2s;
        }

        .soc-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        /* CENTER STACK */
        .center-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* GLOBAL THREAT MAP BOX */
        .threat-map-box {
            background: #020813;
            border: 1.5px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 12px;
            position: relative;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--glow-cyan);
            overflow: hidden;
        }

        .map-grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,243,255,0.06) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,243,255,0.06) 1px, transparent 1px);
            background-size: 25px 25px;
            z-index: 1;
            pointer-events: none;
        }

        .map-content {
            position: relative;
            z-index: 2;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .world-map-svg {
            width: 100%;
            max-height: 160px;
            opacity: 0.75;
            filter: drop-shadow(0 0 10px var(--neon-cyan));
        }

        /* Moving Threat Beacons on Map */
        .beacon {
            position: absolute;
            width: 8px; height: 8px;
            background: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-pink);
            animation: beaconPulse 1.5s infinite;
            z-index: 3;
        }
        @keyframes beaconPulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* TERMINAL WINDOW */
        .terminal-box {
            background: rgba(2, 8, 15, 0.95);
            border: 1.5px solid var(--neon-green);
            border-radius: 8px;
            height: 300px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--glow-green);
            overflow: hidden;
        }

        .terminal-topbar {
            background: #05160c;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-green);
            font-size: 0.8rem;
        }

        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }

        .terminal-body {
            padding: 12px;
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--neon-green);
        }

        .terminal-input-bar {
            display: flex;
            padding: 8px 12px;
            background: #020a05;
            border-top: 1px solid rgba(0, 255, 65, 0.3);
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: var(--neon-green);
            flex-grow: 1;
            font-size: 0.9rem;
            outline: none;
            margin-left: 6px;
        }

        /* CHARTS & LOGS */
        .chart-box {
            background: #020813;
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.8rem;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 100px;
            padding-top: 10px;
            border-bottom: 1px solid rgba(0,243,255,0.3);
        }

        .bar {
            flex-grow: 1;
            background: var(--neon-cyan);
            border-radius: 2px 2px 0 0;
            transition: height 0.4s ease;
        }

        .log-analysis {
            background: rgba(0,0,0,0.6);
            border-left: 3px solid var(--neon-orange);
            padding: 8px;
            font-size: 0.75rem;
            height: 170px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.8rem;
            color: rgba(0, 243, 255, 0.6);
            margin-top: auto;
            border-top: 1px solid rgba(0, 243, 255, 0.2);
        }

        /* TEAM CHAT MODAL (WHATSAPP/GROUP STYLE) */
        .chat-float-btn {
            position: fixed !important;
            bottom: 25px !important;
            right: 25px !important;
            background: #021a2c !important;
            color: var(--neon-cyan) !important;
            border: 2px solid var(--neon-cyan) !important;
            padding: 12px 20px !important;
            border-radius: 30px !important;
            font-weight: bold !important;
            font-size: 0.9rem !important;
            cursor: pointer !important;
            z-index: 999999 !important;
            box-shadow: var(--glow-cyan) !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            animation: pulse 1.8s infinite;
        }
        .chat-float-btn:hover { background: var(--neon-cyan); color: #000; }

        .chat-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(1, 6, 15, 0.88);
            z-index: 1000000;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .chat-modal.open { display: flex; }

        .chat-box {
            width: 100%; max-width: 440px;
            height: 520px;
            background: #031020;
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            box-shadow: var(--glow-cyan);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #071f38;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-cyan);
        }

        .chat-messages {
            flex-grow: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.88rem;
        }

        .msg {
            background: rgba(0, 243, 255, 0.1);
            border-left: 3px solid var(--neon-cyan);
            padding: 6px 10px;
            border-radius: 4px;
            color: #fff;
        }
        .msg.me {
            background: rgba(0, 255, 65, 0.1);
            border-left-color: var(--neon-green);
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #010810;
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            gap: 8px;
        }

        .chat-input-area input {
            flex-grow: 1;
            background: #000;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 10px;
            border-radius: 4px;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-send-btn {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            padding: 0 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
