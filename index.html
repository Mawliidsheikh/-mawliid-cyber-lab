<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAWLIID eFOOTBALL 2026 | ONLINE PVP</title>
    <style>
        :root {
            --ef-dark: #020710;
            --ef-blue: #0055ff;
            --ef-red: #ff0055;
            --ef-yellow: #ffd700;
            --ef-cyan: #00f3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--ef-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Konami eFootball Broadcast Header */
        header {
            width: 100%;
            background: linear-gradient(90deg, #040e22 0%, #0a1b38 50%, #22040f 100%);
            border-bottom: 2px solid var(--ef-yellow);
            padding: 10px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 2px solid var(--ef-yellow);
            overflow: hidden;
            box-shadow: 0 0 12px var(--ef-yellow);
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

        .title h1 { font-size: 1.1rem; color: var(--ef-yellow); font-weight: 900; letter-spacing: 1px; }
        .title p { font-size: 0.75rem; color: var(--ef-cyan); }

        /* Room & Match Controls */
        .match-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .room-input {
            background: #000;
            border: 1px solid var(--ef-cyan);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 120px;
            text-align: center;
            font-weight: bold;
        }

        .btn-konami {
            background: var(--ef-yellow);
            color: #000;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
            font-size: 0.82rem;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .btn-konami:hover { background: #fff; }

        /* Scoreboard */
        .scoreboard {
            background: rgba(0,0,0,0.9);
            border: 2px solid var(--ef-cyan);
            border-radius: 8px;
            display: flex;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .team-h { background: var(--ef-blue); padding: 5px 12px; font-weight: 900; font-size: 0.85rem; }
        .score-box { padding: 5px 14px; font-size: 1.2rem; font-weight: 900; color: var(--ef-yellow); background: #000; }
        .team-a { background: var(--ef-red); padding: 5px 12px; font-weight: 900; font-size: 0.85rem; }

        /* Main Stadium Arena */
        .stadium-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #0b3d16 0%, #021206 100%);
            padding: 10px;
        }

        .pitch-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: #093815;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #eFootballCanvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 500px;
        }

        /* Konami Goal Banner */
        #goalBanner {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, rgba(0, 85, 255, 0.95), rgba(0,0,0,0.95));
            border: 4px solid var(--ef-yellow);
            color: var(--ef-yellow);
            padding: 15px 40px;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 900;
            border-radius: 14px;
            text-shadow: 0 0 15px var(--ef-yellow);
            box-shadow: 0 0 30px rgba(255,215,0,0.8);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 50;
            text-align: center;
        }
        #goalBanner.show { transform: translate(-50%, -50%) scale(1); }

        /* Mobile & PC Touch Controllers (Konami Layout) */
        .controller-hud {
            width: 100%;
            max-width: 950px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(2, 44px);
            gap: 5px;
        }

        .d-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--ef-cyan);
            color: #fff;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .d-btn:active { background: var(--ef-cyan); color: #000; }

        .action-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .act-btn {
            border-radius: 50%;
            border: 3px solid #fff;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .act-btn:active { transform: scale(0.92); }

        .btn-pass { width: 62px; height: 62px; background: radial-gradient(circle, #0088ff, #0044aa); font-size: 0.78rem; }
        .btn-shoot { width: 76px; height: 76px; background: radial-gradient(circle, #ff0055, #990022); font-size: 0.88rem; }

        /* Chat & Room Info Bar */
        .room-info-bar {
            width: 100%;
            max-width: 950px;
            margin-top: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(0,243,255,0.3);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.78rem;
            color: rgba(0, 255, 65, 0.6);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Konami eFootball Broadcast Header -->
    <header>
        <div class="brand">
            <div class="logo-box">
                <img src="logo.jpg" onerror="this.src='https://github.com/Mawliidsheikh.png'" alt="Mawliid">
            </div>
            <div class="title">
                <h1>MAWLIID eFOOTBALL PRO</h1>
                <p>ONLINE ROOM MATCH</p>
            </div>
        </div>

        <div class="match-controls">
            <span style="font-size: 0.78rem; color: #aaa;">ROOM ID:</span>
            <input type="text" id="roomCode" class="room-input" value="MAWLIID-PVP">
            <button class="btn-konami" onclick="copyInviteLink()">📋 INVITE LINK</button>
            <button class="btn-konami" style="background: var(--ef-cyan);" onclick="toggleTeamSide()">SIDE: <span id="sideLabel">HOME (BLUE)</span></button>
        </div>

        <div class="scoreboard">
            <div class="team-h">MAWLIID FC</div>
            <div class="score-box"><span id="scoreH">0</span> - <span id="scoreA">0</span></div>
            <div class="team-a">OPPONENT</div>
        </div>
    </header>

    <!-- Stadium Arena -->
    <div class="stadium-container">
        <div class="pitch-wrapper">
            <canvas id="eFootballCanvas" width="900" height="480"></canvas>
            <div id="goalBanner">GOOOAAALLL! ⚽🔥</div>
        </div>

        <!-- Room Info Bar -->
        <div class="room-info-bar">
            <span id="roomStatus" style="color: var(--ef-yellow);">🟢 Qolku wuu diyaar yahay. Dir link-ga si saaxiibkaagu u soo galo!</span>
            <span style="color: var(--ef-cyan);">PC: Fallaaraha + [SPACE] | Mobile: Badhammada hoose</span>
        </div>

        <!-- Konami Touch HUD Controllers -->
        <div class="controller-hud">
            <div class="dpad-grid">
                <div></div>
                <button class="d-btn" onmousedown="setKey('ArrowUp',true)" onmouseup="setKey('ArrowUp',false)" ontouchstart="setKey('ArrowUp',true)" ontouchend="setKey('ArrowUp',false)">▲</button>
                <div></div>
                <button class="d-btn" onmousedown="setKey('ArrowLeft',true)" onmouseup="setKey('ArrowLeft',false)" ontouchstart="setKey('ArrowLeft',true)" ontouchend="setKey('ArrowLeft',false)">◀</button>
                <button class="d-btn" onmousedown="setKey('ArrowDown',true)" onmouseup="setKey('ArrowDown',false)" ontouchstart="setKey('ArrowDown',true)" ontouchend="setKey('ArrowDown',false)">▼</button>
                <button class="d-btn" onmousedown="setKey('ArrowRight',true)" onmouseup="setKey('ArrowRight',false)" ontouchstart="setKey('ArrowRight',true)" ontouchend="setKey('ArrowRight',false)">▶</button>
            </div>

            <div class="action-group">
                <button class="act-btn btn-pass" onclick="playerPass()">PASS</button>
                <button class="act-btn btn-shoot" onclick="playerShoot()">SHOOT</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Mawliid Sheikh Cyber Lab | eFootball Online Multiplayer Engine
    </footer>

            { x: 350, y: 320, r: 18, speed: 4.8, color: '#0055ff', num: '10' }  // ST
        ];

        // Away Team (Red - Opponent / AI)
        const awayPlayers = [
            { x: W - 150, y: H / 2, r: 17, speed: 4.5, color: '#ff0055', num: '1' }, // GK
            { x: W - 300, y: 160, r: 18, speed: 4.6, color: '#ff0055', num: '8' }, // MID
            { x: W - 350, y: 320, r: 18, speed: 4.6, color: '#ff0055', num: '9' }  // ST
        ];

        function setKey(k, val) { keys[k] = val; }

        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            keys[e.key] = true;
            if (e.key === ' ') playerShoot();
        });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        // Room Link Sharing
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('room')) {
            document.getElementById('roomCode').value = urlParams.get('room');
            isHomeTeam = false; // Join as Away team (Red)
            document.getElementById('sideLabel').textContent = 'AWAY (RED)';
            document.getElementById('roomStatus').textContent = '🟢 Waxaad ku biirtay qolka saaxiibkaa adigoo ah Away Team!';
        }

        function copyInviteLink() {
            const code = document.getElementById('roomCode').value || 'MAWLIID-PVP';
            const link = `${window.location.origin}${window.location.pathname}?room=${code}`;
            navigator.clipboard.writeText(link);
            alert(`Link-ga qolka (${code}) waa la koobiyeeyay! U dir saaxiibkaa WhatsApp ama Telegram si uu kuu soo galo.`);
        }

        function toggleTeamSide() {
            isHomeTeam = !isHomeTeam;
            document.getElementById('sideLabel').textContent = isHomeTeam ? 'HOME (BLUE)' : 'AWAY (RED)';
        }

        function getActivePlayer() {
            const squad = isHomeTeam ? homePlayers : awayPlayers;
            // Return closest outfield player to ball
            return squad[1].x < squad[2].x ? squad[2] : squad[1];
        }

        function playerShoot() {
            const active = getActiveParameterPlayer();
            const targetX = isHomeTeam ? W - 15 : 15;
            const targetY = H / 2;
            const angle = Math.atan2(targetY - ball.y, targetX - ball.x);
            ball.vx = Math.cos(angle) * 15;
            ball.vy = Math.sin(angle) * 15;
        }

        function playerPass() {
            const active = getActiveParameterPlayer();
            const squad = isHomeTeam ? homePlayers : awayPlayers;
            const target = active === squad[1] ? squad[2] : squad[1];
            const angle = Math.atan2(target.y - ball.y, target.x - ball.x);
            ball.vx = Math.cos(angle) * 11;
            ball.vy = Math.sin(angle) * 11;
        }

        function getActiveParameterPlayer() {
            const squad = isHomeTeam ? homePlayers : awayPlayers;
            return Math.hypot(ball.x - squad[1].x, ball.y - squad[1].y) < Math.hypot(ball.x - squad[2].x, ball.y - squad[2].y) ? squad[1] : squad[2];
        }

        function showGoalBanner(text) {
            const b = document.getElementById('goalBanner');
            b.textContent = text;
            b.classList.add('show');
            setTimeout(() => b.classList.remove('show'), 2000);
        }

        function resetPositions() {
            ball.x = W / 2; ball.y = H / 2; ball.vx = 0; ball.vy = 0;
            homePlayers[0].x = 150; homePlayers[0].y = H / 2;
            homePlayers[1].x = 300; homePlayers[1].y = 160;
            homePlayers[2].x = 350; homePlayers[2].y = 320;

            awayPlayers[1].x = W - 300; awayPlayers[1].y = 160;
            awayPlayers[2].x = W - 350; awayPlayers[2].y = 320;
            isPaused = false;
        }
