<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Contacts &amp; People Directory</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-card {
            background: #0f172a;
            color: #ffffff;
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-card h1 {
            font-size: 1.35rem;
        }

        .badge {
            background: #16a34a;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        .card h2 {
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 10px;
        }

        .input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #0f172a;
            background: #ffffff;
        }

        .btn-add {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .btn-add:hover {
            background: #1d4ed8;
        }

        .btn-wa {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 7px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-wa:hover {
            background: #15803d;
        }

        .btn-del {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.84rem;
            font-weight: 600;
            color: #15803d;
            min-height: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.88rem;
        }

        th, td {
            padding: 11px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 0.78rem;
            text-transform: uppercase;
        }

        .empty-row {
            color: #64748b;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <div>
                <h1>Shabakadda Diiwaangelinta &amp; Fariinta WhatsApp</h1>
                <div style="font-size:0.84rem; color:#cbd5e1; margin-top:3px;">
                    Ku diiwaangeli qofka iyo lambarkiisa, kadibna si toos ah WhatsApp ugu dir.
                </div>
            </div>
            <div class="badge" id="total-badge">0 Qof</div>
        </div>

        <!-- DIIWAANGELINTA QOFKA -->
        <div class="card">
            <h2>1. Diiwaangeli Qof Cusub</h2>
            <div class="form-grid">
                <input type="text" id="person-name" class="input" placeholder="Magaca qofka *">
                <input type="tel" id="person-phone" class="input" placeholder="Number-ka WhatsApp (tusaale: +2519...)*">
                <input type="text" id="person-note" class="input" placeholder="Faallo / Xil (ikhtiyaari)">
                <button type="button" class="btn-add" id="btn-save-person">+ Kaydi Qofka</button>
            </div>
            <div class="status-msg" id="status-msg"></div>
        </div>

        <!-- FARRIINTA WHATSAPP -->
        <div class="card">
            <h2>2. Qor Farriinta Loo Dirayo WhatsApp</h2>
            <input type="text" id="wa-message" class="input" placeholder="Qor fariinta aad WhatsApp ugu diri rabto (tusaale: Asc, waa Mawliid)..." value="Salaan, waxaa kula soo xiriiraya Mawliid.">
        </div>

        <!-- LIISKA DADKA LA DIIWAANGELIYEY -->
        <div class="card">
            <h2>3. Dadka Diiwaangashan (<span id="count-label">0</span>)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Magaca</th>
                        <th>Number-ka</th>
                        <th>Faallo</th>
                        <th>Ficil</th>
                    </tr>
                </thead>
                <tbody id="people-tbody">
                    <tr><td colspan="4" class="empty-row">Weli cidna lama diiwaangelin.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const STORAGE_KEY = 'mawliid_whatsapp_people_v1';
            let people = [];

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) people = JSON.parse(raw) || [];
            } catch (e) {
                people = [];
            }

            function savePeople() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
                } catch (e) {}
            }

            function setStatus(text, isError) {
                const el = document.getElementById('status-msg');
                el.style.color = isError ? '#dc2626' : '#15803d';
                el.textContent = text;
            }

            function cleanDigits(phone) {
                return (phone || '').replace(/[^0-9]/g, '');
            }

            function sendWhatsApp(person) {
                const digits = cleanDigits(person.phone);
                if (!digits) {
                    setStatus('Number-ka qofkan sax maaha.', true);
                    return;
                }
                const customMsg = document.getElementById('wa-message').value.trim();
                const finalMsg = customMsg || ('Salaan ' + person.name + ', waxaa kula soo xiriiraya Mawliid.');
                const url = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(finalMsg);
                setStatus('Waxaa loo furay WhatsApp: ' + person.name + ' (' + person.phone + ')', false);
                window.open(url, '_blank', 'noopener,noreferrer');
            }

            function renderTable() {
                document.getElementById('count-label').textContent = people.length;
                document.getElementById('total-badge').textContent = people.length + ' Qof';

                const tbody = document.getElementById('people-tbody');
                if (!people.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Weli cidna lama diiwaangelin.</td></tr>';
                    return;
                }

                tbody.innerHTML = people.map(function(p, idx) {
                    return '<tr>' +
                        '<td><strong>' + escapeHtml(p.name) + '</strong></td>' +
                        '<td>' + escapeHtml(p.phone) + '</td>' +
                        '<td>' + escapeHtml(p.note || '-') + '</td>' +
                        '<td>' +
                            '<button type="button" class="btn-wa send-btn" data-idx="' + idx + '">Dir WhatsApp</button> ' +
                            '<button type="button" class="btn-del del-btn" data-idx="' + idx + '">Tirtir</button>' +
                        '</td>' +
                    '</tr>';
                }).join('');

                tbody.querySelectorAll('.send-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.getAttribute('data-idx'), 10);
                        if (people[idx]) sendWhatsApp(people[idx]);
                    });
                });

                tbody.querySelectorAll('.del-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.getAttribute('data-idx'), 10);
                        people.splice(idx, 1);
                        savePeople();
                        renderTable();
                        setStatus('Qofkii waa laga saaray liiska.', false);
                    });
                });
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            document.getElementById('btn-save-person').addEventListener('click', function() {
                const nameInput = document.getElementById('person-name');
                const phoneInput = document.getElementById('person-phone');
                const noteInput = document.getElementById('person-note');

                const name = nameInput.value.trim();
                const phone = phoneInput.value.trim();
                const note = noteInput.value.trim();

                if (!name) {
                    setStatus('Fadlan qor magaca qofka.', true);
                    nameInput.focus();
                    return;
                }

                if (!cleanDigits(phone)) {
                    setStatus('Fadlan qor number telefoon oo sax ah.', true);
                    phoneInput.focus();
                    return;
                }

                people.push({ name: name, phone: phone, note: note });
                savePeople();
                renderTable();

                nameInput.value = '';
                phoneInput.value = '';
                noteInput.value = '';
                setStatus('Waa la diiwaangeliyey: ' + name + ' (' + phone + '). Hadda guji "Dir WhatsApp".', false);
            });

            renderTable();
        });
    </script>
</body>
</html>
