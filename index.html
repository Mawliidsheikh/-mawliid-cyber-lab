<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball 3D | Real Simulation Match</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            border: 3px solid #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            border-radius: 8px;
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #06240d 0%, #031507 100%);
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            font-size: 1.4rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 25px;
            border-radius: 20px;
            border: 1.5px solid #ffe600;
            letter-spacing: 2px;
        }

        .controls-hint {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #00e5ff;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="hud">
            <span style="color: #00ff66;">MESSI (TEAM A): <span id="score-a">0</span></span>
            <span>VS</span>
            <span style="color: #ff0055;">RONALDO (TEAM B): <span id="score-b">0</span></span>
        </div>
        <canvas id="field" width="900" height="500"></canvas>
    </div>

    <div class="controls-hint">
        <strong>CONTROLS:</strong> Isticmaal Furayaasha **W, A, S, D** si aad u dhaqaajiso Messi | Riix **SPACEBAR** si aad u tuurto/shooteyso kubadda!
    </div>

    <script>
        const canvas = document.getElementById("field");
        const ctx = canvas.getContext("2d");

        // Game Objects
        let ball = { x: 450, y: 250, vx: 0, vy: 0, radius: 10, speed: 0.98 };
        let playerA = { x: 200, y: 250, radius: 18, speed: 4, color: "#00ff66", name: "Messi" };
        let playerB = { x: 700, y: 250, radius: 18, speed: 3, color: "#ff0055", name: "Ronaldo" };

        let scoreA = 0;
        let scoreB = 0;

        let keys = {};

        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (e.code === "Space") {
                // Shoot ball towards opponent goal
                let dx = ball.x - playerA.x;
                let dy = ball.y - playerA.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 40) {
                    ball.vx = (dx / dist) * 12;
                    ball.vy = (dy / dist) * 12;
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        function update() {
            // Player A Movement (WASD)
            if (keys["KeyW"] && playerA.y > 30) playerA.y -= playerA.speed;
            if (keys["KeyS"] && playerA.y < canvas.height - 30) playerA.y += playerA.speed;
            if (keys["KeyA"] && playerA.x > 30) playerA.x -= playerA.speed;
            if (keys["KeyD"] && playerA.x < canvas.width / 2) playerA.x += playerA.speed;

            // Simple AI for Player B (Ronaldo tracks the ball)
            if (playerB.y < ball.y) playerB.y += 2;
            if (playerB.y > ball.y) playerB.y -= 2;
            if (playerB.x < ball.x) playerB.x += 1.5;
            if (playerB.x > ball.x) playerB.x -= 1.5;

            // Ball Physics
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= ball.speed;
            ball.vy *= ball.speed;

            // Boundaries (Walls)
            if (ball.y < 15 || ball.y > canvas.height - 15) ball.vy *= -1;

            // Collision with Player A
            let distA = Math.hypot(ball.x - playerA.x, ball.y - playerA.y);
            if (distA < playerA.radius + ball.radius) {
                ball.vx = (ball.x - playerA.x) * 0.4 + playerA.speed;
                ball.vy = (ball.y - playerA.y) * 0.4;
            }

            // Collision with Player B
            let distB = Math.hypot(ball.x - playerB.x, ball.y - playerB.y);
            if (distB < playerB.radius + ball.radius) {
                ball.vx = (ball.x - playerB.x) * 0.4;
                ball.vy = (ball.y - playerB.y) * 0.4;
            }

            // Goal Detection
            if (ball.x <= 15) {
                if (ball.y > 180 && ball.y < 320) {
                    scoreB++;
                    document.getElementById("score-b").textContent = scoreB;
                    resetBall();
                } else {
                    ball.vx *= -1;
                    ball.x = 20;
                }
            }
            if (ball.x >= canvas.width - 15) {
                if (ball.y > 180 && ball.y < 320) {
                    scoreA++;
                    document.getElementById("score-a").textContent = scoreA;
                    resetBall();
                } else {
                    ball.vx *= -1;
                    ball.x = canvas.width - 20;
                }
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.vx = 0;
            ball.vy = 0;
        }

        function drawField() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grass lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 3;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            // Center line
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 20);
            ctx.lineTo(canvas.width / 2, canvas.height - 20);
            ctx.stroke();

            // Center circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Goals
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.fillRect(0, 180, 15, 140);
            ctx.fillRect(canvas.width - 15, 180, 15, 140);

            // Draw Ball
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Player A (Messi - Green)
            ctx.fillStyle = playerA.color;
            ctx.beginPath();
            ctx.arc(playerA.x, playerA.y, playerA.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = "12px Courier New";
            ctx.fillText(playerA.name, playerA.x - 20, playerA.y - 22);

            // Draw Player B (Ronaldo - Pink)
            ctx.fillStyle = playerB.color;
            ctx.beginPath();
            ctx.arc(playerB.x, playerB.y, playerB.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.fillText(playerB.name, playerB.x - 20, playerB.y - 22);
        }

        function loop() {
            update();
            drawField();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
