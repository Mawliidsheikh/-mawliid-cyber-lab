<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVEMBER 2026 | TACTICAL SCHEDULE</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --dark-bg: #02060d;
            --card-bg: rgba(6, 18, 34, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.12), transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--neon-cyan);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-bar h1 {
            color: #fff;
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        .stats-pill {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .stat-done {
            color: var(--neon-green);
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--neon-green);
            padding: 6px 14px;
            border-radius: 6px;
        }

        .stat-fail {
            color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--neon-pink);
            padding: 6px 14px;
            border-radius: 6px;
        }

        .grid-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .day-card {
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 243, 255, 0.35);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .day-card:hover:not(.locked) {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transform: translateY(-3px);
        }

        .day-card.locked-done {
            border-color: var(--neon-green);
            background: rgba(0, 255, 65, 0.06);
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.25);
        }

        .day-card.locked-fail {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.06);
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.25);
        }
