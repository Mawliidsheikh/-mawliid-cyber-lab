<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALBUSHRA KG, PRIMARY AND SECONDARY SCHOOL</title>
    <style>
        :root {
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-active: #2563eb;
            --topbar-bg: #ffffff;
            --body-bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body.dark-mode {
            --topbar-bg: #0f172a;
            --body-bg: #060b14;
            --card-bg: #131c2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #24324a;
        }

        body.sidebar-emerald {
            --sidebar-bg: #064e3b;
            --sidebar-active: #059669;
        }

        body.sidebar-indigo {
            --sidebar-bg: #1e1b4b;
            --sidebar-active: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--body-bg);
            color: var(--text-main);
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 235px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 120;
            transition: transform 0.22s, background 0.22s;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 20px 14px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .school-crest {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            border-radius: 50%;
            border: 3px solid #f59e0b;
            background: #ffffff;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.05rem;
        }

        .user-avatar {
            width: 62px;
            height: 62px;
            margin: 6px auto 8px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            background: #2563eb;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.35rem;
        }

        .user-name {
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
        }

        .nav-list {
            list-style: none;
            padding: 8px 0;
        }

        .nav-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--sidebar-text);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(37, 99, 235, 0.22);
            color: #ffffff;
            border-left: 3px solid #3b82f6;
        }

        .main-area {
            margin-left: 235px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: margin-left 0.22s;
        }

        .main-area.expanded {
            margin-left: 0;
        }

        .topbar {
            background: var(--topbar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 9px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 80;
        }

        .topbar-left, .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill-btn {
            border: 1px solid var(--border-color);
            background: var(--body-bg);
            color: var(--text-main);
            padding: 6px 11px;
            border-radius: 7px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .pill-btn.active-mode {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 0.9rem;
        }

        .mini-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1e3a8a;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-success {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 6px 11px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .content-wrap {
            padding: 20px;
            flex: 1;
        }

        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .card-header h1, .card-header h2 {
            font-size: 1.45rem;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.86rem;
        }

        th, td {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            background: var(--body-bg);
            font-weight: 700;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .input-box {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.86rem;
        }

        /* FLOATING OVERLAY WINDOW THAT DOES NOT HIDE OR BLOCK ANYTHING */
        .floating-dock {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 350px;
            max-width: calc(100vw - 36px);
            background: var(--card-bg);
            border: 2px solid #2563eb;
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28);
            z-index: 400;
            display: none;
            overflow: hidden;
        }

        .floating-dock.open {
            display: block;
        }

        .dock-head {
            background: #2563eb;
            color: #ffffff;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .dock-close {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .dock-body {
            padding: 14px;
        }

        @media (max-width: 820px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.mobile-open { transform: translateX(0); }
            .main-area { margin-left: 0; }
        }

        @media print {
            .sidebar, .topbar, .floating-dock, .no-print { display: none !important; }
            .main-area { margin-left: 0 !important; }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="school-crest">AB</div>
                <div class="user-avatar" id="side-avatar">M</div>
                <div class="user-name" id="side-name">Mawliid</div>
            </div>

            <ul class="nav-list">
                <li><button type="button" class="nav-btn" data-view="dashboard">Dashboard</button></li>
                <li><button type="button" class="nav-btn" data-view="coworkers">Co-Workers Network</button></li>
                <li><button type="button" class="nav-btn active" data-view="exam-result">My Exam Result</button></li>
                <li><button type="button" class="nav-btn" data-view="student-data">Student Data</button></li>
                <li><button type="button" class="nav-btn" data-view="fees">Fees Collection</button></li>
                <li><button type="button" class="nav-btn" data-view="calendar">My Calendar</button></li>
                <li><button type="button" class="nav-btn" data-view="subjects">My Subjects</button></li>
                <li><button type="button" class="nav-btn" data-view="timetable">My Timetable</button></li>
                <li><button type="button" class="nav-btn" data-view="exam-timetable">My Exam Timetable</button></li>
                <li><button type="button" class="nav-btn" data-view="online-exam">Online Examination</button></li>
                <li><button type="button" class="nav-btn" data-view="attendance">My Attendance</button></li>
                <li><button type="button" class="nav-btn" data-view="notices">My Notice Board</button></li>
