<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAWLIID SHEIKH | eFOOTBALL PRO 2026</title>
    <style>
        :root {
            --ef-blue: #0055ff;
            --ef-yellow: #ffd700;
            --ef-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-green: #00ff41;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #020804;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top eFootball TV Broadcast Scoreboard */
        .tv-header {
            width: 100%;
            height: 64px;
            background: linear-gradient(90deg, #050d1a 0%, #0a1f14 50%, #1a050d 100%);
            border-bottom: 2px solid var(--ef-yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-ring {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid var(--ef-yellow);
            padding: 2px;
            box-shadow: 0 0 10px var(--ef-yellow);
        }

        .logo-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: top;
        }

        .brand-name {
            font-weight: 900;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            letter-spacing: 1px;
            color: var(--ef-yellow);
        }

        /* Scoreboard Pill */
        .scoreboard {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .team-home {
            background: var(--ef-blue);
            padding: 6px 14px;
            font-weight: 900;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
        }

        .score-num {
            padding: 6px 16px;
            font-size: clamp(1.1rem, 2.2vw, 1.4rem);
            font-weight: 900;
            color: var(--ef-yellow);
            background: #000;
        }

        .team-away {
            background: var(--ef-pink);
            padding: 6px 14px;
            font-weight: 900;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
        }

        .timer-box {
            background: #111;
            padding: 6px 12px;
            color: var(--neon-green);
            font-weight: bold;
            border-left: 1px solid #333;
        }

        .restart-btn {
            background: var(--ef-yellow);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .restart-btn:hover { background: #fff; }

        /* Full Screen Stadium Container */
        .stadium-area {
            position: relative;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #0d471d 0%, #031709 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 1300px;
            max-height: 720px;
            border: 3px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }

        /* Goal / Kickoff Big Banner */
        #banner {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, rgba(0, 85, 255, 0.95), rgba(0, 0, 0, 0.95));
            border: 4px solid var(--ef-yellow);
            color: var(--ef-yellow);
            padding: 20px 50px;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 900;
            border-radius: 16px;
            text-shadow: 0 0 20px var(--ef-yellow);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 30;
            text-align: center;
        }

        #banner.active {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Floating Game Controls (Bottom Overlay for Mobile & Mouse) */
        .hud-controls {
            position: absolute;
            bottom: 18px;
            left: 0;
            width: 100%;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 25;
        }

        .dpad {
            pointer-events: auto;
            display: grid;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(2, 48px);
            gap: 6px;
            opacity: 0.85;
        }

        .pad-btn {
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid var(--neon-cyan);
            color: #fff;
            font-size: 1.3rem;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .pad-btn:active { background: var(--neon-cyan); color: #000; }

        .action-cluster {
            pointer-events: auto;
            display: flex;
            gap: 14px;
            align-items: center;
            opacity: 0.9;
        }

        .act-btn {
            border-radius: 50%;
            border: 3px solid #fff;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        .act-btn:active { transform: scale(0.9); }

        .btn-sprint {
            width: 62px; height: 62px;
            background: radial-gradient(circle, #ffaa00, #cc6600);
            font-size: 0.75rem;
        }

        .btn-pass {
            width: 72px; height: 72px;
            background: radial-gradient(circle, #0088ff, #0044aa);
            font-size: 0.85rem;
        }

        .btn-shoot {
            width: 84px; height: 84px;
            background: radial-gradient(circle, #ff0055, #990022);
            font-size: 0.95rem;
        }

        .pc-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            color: #ddd;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Top Scoreboard -->
    <header class="tv-header">
        <div class="brand">
            <div class="logo-ring">
                <img src="logo.jpg" onerror="this.src='https://github.com/Mawliidsheikh.png'" alt="Mawliid">
            </div>
            <div class="brand-name">MAWLIID eFOOTBALL 2026</div>
        </div>

        <div class="scoreboard">
            <div class="team-home">MAWLIID FC</div>
            <div class="score-num"><span id="score-p">0</span> - <span id="score-ai">0</span></div>
            <div class="team-away">CYBER AI</div>
            <div class="timer-box"><span id="clock">00</span>'</div>
        </div>

        <button class="restart-btn" onclick="resetMatch()">↻ NEW MATCH</button>
    </header>

    <!-- Full Screen Pitch -->
    <div class="stadium-area">
        <div class="pc-hint">PC: Fallaaraha (Dhaqaaq) | [X] Pass | [SPACE] Shoot | [SHIFT] Sprint</div>
        <canvas id="gameCanvas" width="1000" height="560"></canvas>
        <div id="banner">GOOOAAALLL! ⚽🔥</div>

        <!-- On-Screen Controls -->
        <div class="hud-controls">
            <div class="dpad">
                <div></div>
                <button class="pad-btn" onmousedown="setKey('ArrowUp',true)" onmouseup="setKey('ArrowUp',false)" ontouchstart="setKey('ArrowUp',true)" ontouchend="setKey('ArrowUp',false)">▲</button>
                <div></div>
                <button class="pad-btn" onmousedown="setKey('ArrowLeft',true)" onmouseup="setKey('ArrowLeft',false)" ontouchstart="setKey('ArrowLeft',true)" ontouchend="setKey('ArrowLeft',false)">◀</button>
                <button class="pad-btn" onmousedown="setKey('ArrowDown',true)" onmouseup="setKey('ArrowDown',false)" ontouchstart="setKey('ArrowDown',true)" ontouchend="setKey('ArrowDown',false)">▼</button>
                <button class="pad-btn" onmousedown="setKey('ArrowRight',true)" onmouseup="setKey('ArrowRight',false)" ontouchstart="setKey('ArrowRight',true)" ontouchend="setKey('ArrowRight',false)">▶</button>
            </div>

            <div class="action-cluster">
                <button class="act-btn btn-sprint" onmousedown="setKey('Shift',true)" onmouseup="setKey('Shift',false)" ontouchstart="setKey('Shift',true)" ontouchend="setKey('Shift',false)">SPRINT</button>
                <button class="act-btn btn-pass" onclick="passBall()">PASS</button>
                <button class="act-btn btn-shoot" onclick="shootBall()">SHOOT</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const W = 1000;
        const H = 560;
        const GOAL_TOP = 200;
        const GOAL_BOTTOM = 360;

        let scoreP = 0;
        let scoreAI = 0;
        let minutes = 0;
        let isPaused = false;
        const keys = {};

        // Ball
        const ball = { x: W / 2, y: H / 2, r: 11, vx: 0, vy: 0, friction: 0.975 };

        // Player Team (Mawliid FC - Blue)
        const p1 = { x: 350, y: 280, r: 20, speed: 4.8, color: '#0066ff', num: '10', active: true };
        const p2 = { x: 250, y: 150, r: 20, speed: 4.5, color: '#0066ff', num: '7', active: false };
        const pGK = { x: 40, y: 280, r: 19, color: '#ffd700', num: '1' };

        // AI Team (Cyber AI - Red)
        const ai1 = { x: 650, y: 280, r: 20, speed: 3.6, color: '#ff0055', num: '9' };
        const ai2 = { x: 750, y: 410, r: 20, speed: 3.4, color: '#ff0055', num: '11' };
        const aiGK = { x: 960, y: 280, r: 19, color: '#00f3ff', num: '1' };

        function setKey(k, val) { keys[k] = val; }

        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            keys[e.key] = true;
            if (e.key === ' ') shootBall();
            if (e.key === 'x' || e.key === 'X') passBall();
        });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        function getActivePlayer() {
            return p1.active ? p1 : p2;
        }

        function getTeammate() {
            return p1.active ? p2 : p1;
        }

        // Switch active player automatically if teammate is much closer to ball
        function autoSwitch() {
            const d1 = Math.hypot(ball.x - p1.x, ball.y - p1.y);
            const d2 = Math.hypot(ball.x - p2.x, ball.y - p2.y);
            if (d2 < d1 - 60) { p1.active = false; p2.active = true; }
            else if (d1 < d2 - 60) { p1.active = true; p2.active = false; }
        }

        function shootBall() {
            const active = getActivePlayer();
            const dist = Math.hypot(ball.x - active.x, ball.y - active.y);
            if (dist < active.r + ball.r + 35) {
                // Aim toward right goal center with slight vertical aim from player
                const targetY = Math.max(GOAL_TOP + 15, Math.min(GOAL_BOTTOM - 15, active.y));
                const angle = Math.atan2(targetY - ball.y, (W - 20) - ball.x);
                ball.vx = Math.cos(angle) * 16;
                ball.vy = Math.sin(angle) * 16;
            }
        }

        function passBall() {
            const active = getActivePlayer();
            const mate = getTeammate();
            const dist = Math.hypot(ball.x - active.x, ball.y - active.y);
            if (dist < active.r + ball.r + 35) {
                const angle = Math.atan2(mate.y - ball.y, mate.x - ball.x);
                ball.vx = Math.cos(angle) * 12;
                ball.vy = Math.sin(angle) * 12;
                p1.active = !p1.active;
                p2.active = !p2.active;
            }
        }

        function showBanner(text) {
            const b = document.getElementById('banner');
            b.textContent = text;
            b.classList.add('active');
            setTimeout(() => b.classList.remove('active'), 2000);
        }

        function resetPositions() {
            p1.x = 350; p1.y = 280; p1.active = true;
            p2.x = 250; p2.y = 150; p2.active = false;
            ai1.x = 650; ai1.y = 280;
            ai2.x = 750; ai2.y = 410;
            ball.x = W / 2; ball.y = H / 2;
            ball.vx = 0; ball.vy = 0;
            isPaused = false;
        }

        function resetMatch() {
            scoreP = 0; scoreAI = 0; minutes = 0;
            document.getElementById('score-p').textContent = '0';
            document.getElementById('score-ai').textContent = '0';
            resetPositions();
            showBanner('KICK OFF! ⚽');
        }

        function handleGoal(who) {
            if (isPaused) return;
            isPaused = true;
            if (who === 'P') {
                scoreP++;
                document.getElementById('score-p').textContent = scoreP;
                showBanner('GOOOAAALLL! MAWLIID FC ⚽🔥');
            } else {
                scoreAI++;
                document.getElementById('score-ai').textContent = scoreAI;
                showBanner('GOAL! CYBER AI 🤖⚽');
            }
            setTimeout(resetPositions, 2100);
        }

        // Match Clock
        setInterval(() => {
            if (!isPaused) {
                minutes++;
                if (minutes > 90) {
                    showBanner(`FULL TIME: ${scoreP} - ${scoreAI}`);
                    minutes = 0;
                }
                document.getElementById('clock').textContent = minutes.toString().padStart(2, '0');
            }
        }, 900);

        function collideBall(ent, power) {
            const dx = ball.x - ent.x;
            const dy = ball.y - ent.y;
            const dist = Math.hypot(dx, dy);
            if (dist < ent.r + ball.r) {
                const angle = Math.atan2(dy, dx);
                ball.vx = Math.cos(angle) * power;
                ball.vy = Math.sin(angle) * power;
                ball.x = ent.x + Math.cos(angle) * (ent.r + ball.r + 2);
                ball.y = ent.y + Math.sin(angle) * (ent.r + ball.r + 2);
            }
        }

        function update() {
            if (isPaused) return;

            autoSwitch();
            const active = getActivePlayer();
            const mate = getTeammate();

            // Active Player Movement
            const spd = keys['Shift'] ? active.speed * 1.45 : active.speed;
            if (keys['ArrowUp'] || keys['w']) active.y -= spd;
            if (keys['ArrowDown'] || keys['s']) active.y += spd;
            if (keys['ArrowLeft'] || keys['a']) active.x -= spd;
            if (keys['ArrowRight'] || keys['d']) active.x += spd;

            active.x = Math.max(30, Math.min(W - 30, active.x));
            active.y = Math.max(30, Math.min(H - 30, active.y));

            // Teammate AI support positioning
            const mateTargetX = Math.min(W - 120, ball.x + 80);
            const mateTargetY = ball.y > H / 2 ? 150 : 410;
            mate.x += (mateTargetX - mate.x) * 0.03;
            mate.y += (mateTargetY - mate.y) * 0.03;

            // AI Chaser (ai1)
            const a1Angle = Math.atan2(ball.y - ai1.y, (ball.x + 12) - ai1.x);
            ai1.x += Math.cos(a1Angle) * ai1.speed;
            ai1.y += Math.sin(a1Angle) * ai1.speed;

            // AI Defender (ai2)
            const a2TargetX = Math.max(600, ball.x + 120);
            const a2TargetY = ball.y;
            ai2.x += (a2TargetX - ai2.x) * 0.03;
            ai2.y += (a2TargetY - ai2.y) * 0.03;

            // Goalkeepers
            aiGK.y += (Math.max(GOAL_TOP + 15, Math.min(GOAL_BOTTOM - 15, ball.y)) - aiGK.y) * 0.09;
            pGK.y += (Math.max(GOAL_TOP + 15, Math.min(GOAL_BOTTOM - 15, ball.y)) - pGK.y) * 0.09;

            // Ball Physics
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= ball.friction;
            ball.vy *= ball.friction;

            // Goal Detection
            if (ball.x + ball.r >= W - 20 && ball.y > GOAL_TOP && ball.y < GOAL_BOTTOM) {
                handleGoal('P');
            } else if (ball.x - ball.r <= 20 && ball.y > GOAL_TOP && ball.y < GOAL_BOTTOM) {
                handleGoal('AI');
            }

            // Boundary Bounces
            if (ball.y - ball.r < 20) { ball.y = 20 + ball.r; ball.vy *= -0.8; }
            if (ball.y + ball.r > H - 20) { ball.y = H - 20 - ball.r; ball.vy *= -0.8; }
            if (ball.x - ball.r < 20 && (ball.y <= GOAL_TOP || ball.y >= GOAL_BOTTOM)) { ball.x = 20 + ball.r; ball.vx *= -0.8; }
            if (ball.x + ball.r > W - 20 && (ball.y <= GOAL_TOP || ball.y >= GOAL_BOTTOM)) { ball.x = W - 20 - ball.r; ball.vx *= -0.8; }

            // Collisions
            collideBall(p1, 6.5);
            collideBall(p2, 6.5);
            collideBall(ai1, 8.5);
            collideBall(ai2, 8.0);
            collideBall(pGK, 11);
            collideBall(aiGK, 11);
        }

        function drawField() {
            // Stadium Mowed Grass Stripes
            const stripeW = W / 12;
            for (let i = 0; i < 12; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#0b4f1e' : '#0e5e24';
                ctx.fillRect(i * stripeW, 0, stripeW, H);
            }

            // White Pitch Markings
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 3;
            ctx.strokeRect(20, 20, W - 40, H - 40);

            // Halfway Line
            ctx.beginPath();
            ctx.moveTo(W / 2, 20);
            ctx.lineTo(W / 2, H - 20);
            ctx.stroke();

            // Center Circle & Spot
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, 80, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(W / 2, H / 2, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // Penalty Areas
            ctx.strokeRect(20, 130, 140, 300);
            ctx.strokeRect(W - 160, 130, 140, 300);

            // Goals (Left & Right Nets)
            ctx.fillStyle = 'rgba(0, 102, 255, 0.35)';
            ctx.fillRect(0, GOAL_TOP, 20, GOAL_BOTTOM - GOAL_TOP);
            ctx.strokeRect(0, GOAL_TOP, 20, GOAL_BOTTOM - GOAL_TOP);

            ctx.fillStyle = 'rgba(255, 0, 85, 0.35)';
            ctx.fillRect(W - 20, GOAL_TOP, 20, GOAL_BOTTOM - GOAL_TOP);
            ctx.strokeRect(W - 20, GOAL_TOP, 20, GOAL_BOTTOM - GOAL_TOP);
        }

        function drawPlayer(p, isControlled = false) {
            // Active Indicator Ring (eFootball Style Triangle/Ring)
            if (isControlled) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r + 7, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Shadow
            ctx.beginPath();
            ctx.ellipse(p.x, p.y + p.r - 2, p.r, 7, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fill();

            // Player Body
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            // Jersey Number
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(p.num, p.x, p.y + 5);
        }

        function drawBall() {
            // Shadow
            ctx.beginPath();
            ctx.ellipse(ball.x + 3, ball.y + 6, ball.r, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fill();

            // Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffd700';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#111';
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            drawField();

            drawPlayer(pGK);
            drawPlayer(aiGK);
            drawPlayer(p1, p1.active);
            drawPlayer(p2, p2.active);
            drawPlayer(ai1);
            drawPlayer(ai2);
            drawBall();

            requestAnimationFrame(gameLoop);
        }

        // Start immediately
        showBanner('KICK OFF! ⚽');
        gameLoop();
    </script>
</body>
</html>
