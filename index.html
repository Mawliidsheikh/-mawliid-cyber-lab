<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVEMBER 2026 // SCHEDULE</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --dark-bg: #02060d;
            --card-bg: rgba(6, 18, 34, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.12), transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--neon-cyan);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-bar h1 {
            color: #fff;
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        .stats-pill {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .stat-done {
            color: var(--neon-green);
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--neon-green);
            padding: 6px 14px;
            border-radius: 6px;
        }

        .stat-fail {
            color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--neon-pink);
            padding: 6px 14px;
            border-radius: 6px;
        }

        .grid-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .day-card {
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 243, 255, 0.35);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .day-card:hover:not(.locked) {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transform: translateY(-3px);
        }

        .day-card.locked-done {
            border-color: var(--neon-green);
            background: rgba(0, 255, 65, 0.06);
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.25);
        }

        .day-card.locked-fail {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.06);
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.25);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .date-num {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        .day-name {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .task-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.25);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }

        .task-input:focus {
            border-color: var(--neon-cyan);
        }

        .task-input:disabled {
            background: transparent;
            border-color: transparent;
            color: #e0e0e0;
            font-weight: bold;
            padding-left: 0;
            cursor: not-allowed;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .btn-mark {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid;
            background: transparent;
            transition: all 0.2s;
        }

        .btn-check {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .btn-check:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-cross {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .btn-cross:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .locked-badge {
            width: 100%;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .badge-done {
            background: rgba(0, 255, 65, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .badge-fail {
            background: rgba(255, 0, 85, 0.15);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>NOVEMBER 2026 // SCHEDULE</h1>
        <div class="stats-pill">
            <div class="stat-done">✓ DONE: <span id="done-count">0</span></div>
            <div class="stat-fail">✗ MISSED: <span id="fail-count">0</span></div>
        </div>
    </div>

    <div class="grid-container" id="calendar-grid"></div>

    <script>
        const daysOfWeek = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        const startDay = 15; // Nov 15, 2026
        const endDay = 30;   // Nov 30, 2026
        const storageKey = "mawliid_nov_2026_locked_schedule_v2";

        let savedData = JSON.parse(localStorage.getItem(storageKey)) || {};

        const grid = document.getElementById("calendar-grid");

        function updateCounters() {
            let done = 0;
            let fail = 0;
            Object.values(savedData).forEach(item => {
                if (item.status === "done") done++;
                if (item.status === "fail") fail++;
            });
            document.getElementById("done-count").textContent = done;
            document.getElementById("fail-count").textContent = fail;
        }

        function lockDay(dayNum, status) {
            const inputEl = document.getElementById(`task-${dayNum}`);
            const taskText = inputEl ? inputEl.value.trim() : "";

            savedData[dayNum] = {
                task: taskText || "NO TASK",
                status: status
            };

            localStorage.setItem(storageKey, JSON.stringify(savedData));
            renderGrid();
        }

        function saveTaskDraft(dayNum, val) {
            if (!savedData[dayNum]) {
                savedData[dayNum] = { task: val, status: "open" };
            } else if (savedData[dayNum].status === "open") {
                savedData[dayNum].task = val;
            }
            localStorage.setItem(storageKey, JSON.stringify(savedData));
        }

        function renderGrid() {
            grid.innerHTML = "";

            for (let d = startDay; d <= endDay; d++) {
                const dateObj = new Date(2026, 10, d); // Month 10 = November
                const dayName = daysOfWeek[dateObj.getDay()];
                const record = savedData[d] || { task: "", status: "open" };
                const isLocked = record.status === "done" || record.status === "fail";

                const card = document.createElement("div");
                card.className = "day-card";
                if (record.status === "done") card.classList.add("locked", "locked-done");
                if (record.status === "fail") card.classList.add("locked", "locked-fail");

                let bottomHTML = "";
                if (!isLocked) {
                    bottomHTML = `
                        <div class="action-row">
                            <button class="btn-mark btn-check" onclick="lockDay(${d}, 'done')">✓</button>
                            <button class="btn-mark btn-cross" onclick="lockDay(${d}, 'fail')">✗</button>
                        </div>
                    `;
                } else if (record.status === "done") {
                    bottomHTML = `<div class="locked-badge badge-done">✓ LOCKED</div>`;
                } else {
                    bottomHTML = `<div class="locked-badge badge-fail">✗ LOCKED</div>`;
                }

                card.innerHTML = `
                    <div class="card-top">
                        <span class="date-num">NOV ${d}</span>
                        <span class="day-name">${dayName}</span>
                    </div>
                    <input 
                        type="text" 
                        id="task-${d}" 
                        class="task-input" 
                        placeholder="Task..." 
                        value="${record.task.replace(/"/g, '&quot;')}"
                        oninput="saveTaskDraft(${d}, this.value)"
                        ${isLocked ? "disabled" : ""}
                    >
                    ${bottomHTML}
                `;

                grid.appendChild(card);
            }

            updateCounters();
        }

        renderGrid();
    </script>
</body>
</html>
