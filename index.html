
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawliid Academy - School Portal</title>
    <style>
        :root {
            --sidebar-bg: #111827;
            --sidebar-text: #cbd5e1;
            --sidebar-active: #2563eb;
            --topbar-bg: #ffffff;
            --body-bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body.dark-mode {
            --topbar-bg: #111827;
            --body-bg: #090d16;
            --card-bg: #161f30;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #263248;
        }

        body.sidebar-emerald {
            --sidebar-bg: #064e3b;
            --sidebar-active: #059669;
        }

        body.sidebar-indigo {
            --sidebar-bg: #1e1b4b;
            --sidebar-active: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--body-bg);
            color: var(--text-main);
            min-height: 100vh;
            transition: background 0.25s, color 0.25s;
        }

        #landing-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #090d16 0%, #172554 60%, #1e1b4b 100%);
            color: #ffffff;
        }

        #landing-screen.hidden {
            display: none;
        }

        .pub-nav {
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(15, 23, 42, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pub-brand {
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .pub-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pub-btn {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-size: 0.86rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .pub-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-login-pill {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 64px 36px;
            max-width: 900px;
        }

        .hero-badge {
            background: rgba(59, 130, 246, 0.22);
            border: 1px solid rgba(147, 197, 253, 0.4);
            color: #bfdbfe;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .hero-section h1 {
            font-size: 2.7rem;
            line-height: 1.15;
            margin-bottom: 14px;
        }

        .hero-section p {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 26px;
            max-width: 620px;
        }

        .hero-cta-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-hero-primary {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 22px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .btn-hero-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 600;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .login-box {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 400px;
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h2 {
            margin-bottom: 6px;
            font-size: 1.35rem;
        }

        .login-box p {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .login-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.92rem;
        }

        #portal-shell {
            display: none;
            min-height: 100vh;
            width: 100%;
        }

        #portal-shell.active {
            display: flex;
        }

        .sidebar {
            width: 245px;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.25s, background 0.25s;
            z-index: 120;
            padding-bottom: 24px;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-title {
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
        }

        .sidebar-sub {
            color: #94a3b8;
            font-size: 0.75rem;
